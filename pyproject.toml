[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv7-metax-c500"
version = "0.1.0.dev0"
description = "Shared probes and acceptance utilities for RWKV-7 on MetaX C500"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "wangyue"}]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
